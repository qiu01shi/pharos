[project]
name = "pharos"
version = "0.2.0"
description = "Typed dataflow runtime for LLM workflows with first-class trace and replay"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "qiushijun", email = "2842368912@qq.com" }
]
keywords = ["llm", "agent", "multi-agent", "dataflow", "trace", "replay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "anyio>=4.3",
    "networkx>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["pharos[dev]"]

[project.scripts]
pharos = "pharos.cli:cli_main"

[project.urls]
Homepage = "https://github.com/qiu01shi/pharos"
Repository = "https://github.com/qiu01shi/pharos"
Issues = "https://github.com/qiu01shi/pharos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos"]

# ==================== Ruff ====================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF012",  # class-level port dicts are intentional in @entity
    "B008",    # typer.Argument / typer.Option in defaults is canonical
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]
"scripts/**/*.py" = ["B", "SIM"]

# ==================== mypy ====================
# Note: pharos uses Pydantic + asyncio Protocol, which produces false
# positives in strict mypy. We keep most strict checks but disable a
# few that are noisy in the P0 stage. P1+ may re-enable.
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "networkx"]
ignore_missing_imports = true

# Pydantic's BaseModel + Protocol interact poorly with mypy strict.
# The LLMProvider protocol has the same issue: stream() can be either
# an async generator or an async def returning AsyncIterator, and mypy
# can't always distinguish. We relax these per-file.
[[tool.mypy.overrides]]
module = ["pharos.llm.*", "pharos.core.entity", "pharos.core.graph"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# ==================== pytest ====================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit real LLM provider APIs (deselect with '-m \"not integration\"')",
]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
